# .github/workflows/benchmark.yml

name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly
    - cron: "0 0 * * 0"  # Sunday midnight

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap evolution state
        run: |
          python scripts/reset.py

      - name: Run benchmark suite
        env:
          BENCHMARK_SIMULATE: "1"
        run: |
          python scripts/benchmark_runner.py --suite easy --variant hermes_v1,laguna_v1 --simulate

      - name: Generate report
        run: |
          python scripts/benchmark_dashboard.py --report overall --save .autoclaw/evals/benchmark/report.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .autoclaw/evals/benchmark/
