# Non-blocking issue-to-fix showcase.
# Live model output never fails the build. Fork pull requests skip the job
# because they cannot read repository secrets.

name: Showcase

on:
  pull_request:
    paths:
      - "src/agents/**"
      - "src/orchestrator.py"
      - "src/schemas/**"
      - "src/verification/**"
      - "src/showcase/**"
      - "src/workspace_seed.py"
      - "prompts/**"
      - "examples/issue_to_fix/**"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  showcase:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run showcase
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SHOWCASE_SANDBOX: subprocess
        run: uv run python scripts/showcase.py --no-open --publish-rate

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-report
          path: reports/showcase/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit refreshed success rate
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/'))
        run: |
          if [ ! -f benchmark/published/showcase_success_rate.json ]; then
            echo "No live showcase rate to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/published/showcase_success_rate.json benchmark/published/showcase_success_rate.md
          if git diff --staged --quiet; then
            echo "Success rate unchanged"
            exit 0
          fi
          git commit -m "chore(showcase): refresh success rate [skip ci]"
          git push
