# Lightweight PR gate: smoke benchmark (simulate) + unit / P0 tests.

name: CI Benchmark (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "router/**"
      - "evals/**"
      - "prompts/**"
      - "benchmark/easy/**"
      - "benchmark/medium/**"
      - "benchmark/hard/**"
      - "benchmark/extreme/**"
      - "benchmark/*.py"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - ".github/workflows/ci-benchmark.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  smoke_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Bootstrap evolution state
        run: uv run python scripts/reset.py

      - name: Run smoke benchmark (easy, simulate)
        run: |
          mkdir -p reports
          uv run python scripts/benchmark_runner.py \
            --suite easy \
            --variant hermes_v1,laguna_v1 \
            --simulate
          uv run python scripts/benchmark_dashboard.py \
            --report overall \
            --output reports/pr_smoke.json
          uv run python scripts/ci_benchmark_summary.py \
            --title "PR smoke (easy)" \
            --report reports/pr_smoke.json

      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark-smoke
          path: |
            reports/
            .autoclaw/evals/benchmark/results.json
          retention-days: 7

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run full test suite
        run: uv run pytest -q
