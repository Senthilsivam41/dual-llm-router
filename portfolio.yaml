schemaVersion: portfolio.dev/v1
kind: Product
metadata:
  id: dual-llm-router
  name: Dual-LLM Router
  description: >
    Role-specialized planner/executor pipeline (Hermes plans, Laguna executes)
    with difficulty-tiered benchmarks and prompt co-evolution.
  stage: preview
  owners:
    - sendil
spec:
  standalone: true
  category: plan-execute
  runtimes:
    python: ">=3.10,<3.15"
  commands:
    setup: make setup
    demo: make demo
    dev: make dev
    check: make check
  services: []
  interfaces:
    python: src/
    cli: scripts/
  integrations:
    consumes:
      - openrouter.chat.v1
    produces:
      - portfolio.evaluation.v1
  docs:
    quickstart: docs/quickstart.md
    architecture: docs/architecture.md
    configuration: docs/configuration.md
